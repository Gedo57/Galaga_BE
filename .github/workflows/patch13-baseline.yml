name: Patch 13 original baseline
on:
  push:
    branches: [patch13/original-baseline]
jobs:
  original-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
